<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="topbar">
    <h1 class="logo">facebook</h1>
    <div class="user-info">
      <div class="avatar" id="avatar">?</div>
      <span id="userName">Cargando...</span>
      <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>

  <div class="feed">
    <div class="card post-composer">
      <textarea id="postText" placeholder="¿Qué estás pensando?"></textarea>
      <div class="composer-actions">
        <button class="btn-post" id="postBtn" disabled>Publicar</button>
      </div>
    </div>

    <div class="card">
      <div id="postsList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">Aún no hay publicaciones. ¡Escribe la primera!</div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
