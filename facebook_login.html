<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook - iniciar sesión o registrarte</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: Helvetica, Arial, sans-serif;
    background-color: #f0f2f5;
    min-height: 100vh;
  }
  .container {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 60px;
    max-width: 1000px;
    margin: 0 auto;
    padding: 60px 20px;
  }
  .left {
    max-width: 500px;
  }
  .logo {
    color: #1877f2;
    font-size: 60px;
    font-weight: bold;
    margin: 0 0 16px 0;
    letter-spacing: -1px;
  }
  .tagline {
    font-size: 28px;
    line-height: 1.3;
    font-weight: normal;
    margin: 0;
    color: #1c1e21;
  }
  .right {
    width: 396px;
    max-width: 100%;
  }
  .login-box {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(0,0,0,.2), 0 8px 16px rgba(0,0,0,.2);
    padding: 20px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 17px;
    border: 1px solid #dddfe2;
    border-radius: 6px;
    outline: none;
  }
  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #1877f2;
  }
  .btn-login {
    width: 100%;
    background-color: #1877f2;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    padding: 14px 0;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .btn-login:hover {
    background-color: #166fe5;
  }
  .forgot {
    display: block;
    text-align: center;
    color: #1877f2;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .forgot:hover {
    text-decoration: underline;
  }
  hr {
    border: none;
    border-top: 1px solid #dadde1;
    margin: 20px 0;
  }
  .btn-create {
    display: block;
    width: fit-content;
    margin: 0 auto;
    background-color: #42b72a;
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .btn-create:hover {
    background-color: #36a420;
  }
  .create-account {
    text-align: center;
  }
  .footer-note {
    text-align: center;
    font-size: 12px;
    margin-top: 28px;
    color: #1c1e21;
  }
  .footer-note a {
    font-weight: bold;
    color: #1c1e21;
    text-decoration: none;
  }
  @media (max-width: 900px) {
    .container {
      flex-direction: column;
      text-align: center;
    }
    .tagline {
      text-align: center;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <div class="left">
      <h1 class="logo">facebook</h1>
      <p class="tagline">Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
    </div>

    <div class="right">
      <div class="login-box">
        <form onsubmit="return false;">
          <input type="text" name="email" placeholder="Correo electrónico o número de teléfono" autocomplete="off">
          <input type="password" name="pass" placeholder="Contraseña" autocomplete="off">
          <button type="submit" class="btn-login">Iniciar sesión</button>
          <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
          <hr>
          <div class="create-account">
            <button type="button" class="btn-create">Crear cuenta nueva</button>
          </div>
        </form>
      </div>
      <p class="footer-note"><a href="#">Crea una página</a> para un negocio o personaje público.</p>
    </div>
  </div>

</body>
</html>
